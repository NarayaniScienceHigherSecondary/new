<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="BPmHtxjCmaQaHl1xXb7TWsTNLI1np3JTkrLludZXsAY" />
    <title>Narayani Science Higher Secondary School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/morphdom@2.7.4/dist/morphdom-umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=17">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a8a', // Deep Blue
                        secondary: '#d4af37', // Gold
                        accent: '#3b82f6', // Light Blue
                    },
                    animation: {
                        blob: "blob 7s infinite"
                    },
                    keyframes: {
                        blob: {
                            "0%": { transform: "translate(0px, 0px) scale(1)" },
                            "33%": { transform: "translate(30px, -50px) scale(1.1)" },
                            "66%": { transform: "translate(-20px, 20px) scale(0.9)" },
                            "100%": { transform: "translate(0px, 0px) scale(1)" }
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans">
    
    <!-- Navigation Bar Removed per user request -->

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow flex flex-col w-full">
        <!-- Views will be injected here by app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-primary text-white py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center text-sm">
            <div id="footer-text">
                &copy; 2026 Narayani Science Higher Secondary School. All rights reserved.
            </div>
            <div class="mt-4 md:mt-0 flex space-x-4">
                <a href="#" onclick="showPrivacyPolicy()" class="hover:text-secondary transition-colors">Privacy Policy</a>
                <a href="#" onclick="showTermsOfService()" class="hover:text-secondary transition-colors">Terms of Service</a>
                <a href="#" onclick="showContactAdmin()" class="hover:text-secondary transition-colors">Contact Admin</a>
            </div>
        </div>
    </footer>

    <!-- Generic Info Modal -->
    <div id="infoModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 max-w-lg w-full animate-fade-in relative">
            <button onclick="document.getElementById('infoModal').classList.replace('flex', 'hidden')" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 transition-colors">
                <i class="fas fa-times text-2xl"></i>
            </button>
            <h3 id="infoModalTitle" class="text-2xl font-bold text-gray-800 dark:text-white mb-4">Title</h3>
            <div id="infoModalBody" class="text-gray-600 dark:text-gray-300 leading-relaxed text-lg">
                Body content
            </div>
        </div>
    </div>

    <!-- Result Modal Container (Shared) -->
    <div id="resultModalContainer"></div>
    
    <!-- Public Notice Modal Container -->
    <div id="publicNoticeModalContainer"></div>
    
    <!-- Welcome Gallery Modal Container -->
    <div id="welcomeGalleryModalContainer"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <script src="data.js?v=226"></script>
    <script src="admin.js?v=226"></script>
    <script src="admin_formfillup.js?v=226"></script>
    <script src="admin_reports.js?v=226"></script>
    <script src="admin_seating.js?v=226"></script>
    <script src="admin_statement.js?v=226"></script>
    <script src="admin_dcr.js?v=226"></script>
    <script src="admin_cashbook.js?v=226"></script>
    <script src="admin_exams.js?v=226"></script>
    <script src="admin_certificate.js?v=226"></script>
    <script src="student.js?v=226"></script>
    <script src="student_exams.js?v=226"></script>
    <script src="staff.js?v=226"></script>
    <script src="app.js?v=226"></script>
</body>
</html>
